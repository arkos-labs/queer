<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Queer Service — Annuaire d'entraide de la communauté LGBTQI+</title>
    <meta
      name="description"
      content="Annuaire d'entraide LGBTQI+ : trouvez et proposez des services de confiance entre membres de la communauté queer. Bricolage, ménage, garde d'animaux, tech, beauté — fait pour nous, par nous."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Queer Service" />

    <meta name="keywords" content="annuaire LGBTQI+, services queer, entraide communauté LGBT, prestataire queer, artisan LGBT, coiffeur trans, babysitter LGBT, bricolage queer, ménage LGBT, réseau entraide queer France" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.queerservices.fr/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Queer Service" />
    <meta property="og:title" content="Queer Service — Annuaire d'entraide de la communauté LGBTQI+" />
    <meta
      property="og:description"
      content="Trouvez et proposez des services en toute confiance, entre membres de la communauté LGBTQI+. Bricolage, ménage, garde d'animaux, tech, beauté et plus."
    />
    <meta property="og:url" content="https://www.queerservices.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:image" content="https://www.queerservices.fr/og-image.png" />
    <meta property="og:image:alt" content="Queer Service — Annuaire d'entraide LGBTQI+" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Queer Service — Annuaire d'entraide de la communauté LGBTQI+" />
    <meta
      name="twitter:description"
      content="Annuaire LGBTQI+ : trouvez et proposez des services de confiance entre membres de la communauté queer. Fait pour nous, par nous."
    />
    <meta name="twitter:image" content="https://www.queerservices.fr/og-image.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Queer Service" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Performance : préconnexion aux polices Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured data : Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Queer Service",
        "url": "https://www.queerservices.fr/",
        "logo": "https://www.queerservices.fr/logo.png",
        "description": "Annuaire d'entraide de la communauté LGBTQI+. Fait pour nous, par nous.",
        "sameAs": []
      }
    </script>

    <!-- Structured data : WebSite + SearchAction (Sitelinks Search Box) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Queer Service",
        "url": "https://www.queerservices.fr/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.queerservices.fr/annuaire?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
