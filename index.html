    <!-- Structured data : FAQPage (citabilité IA) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Qu'est-ce que Queer Service ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Queer Service est un annuaire d'entraide communautaire LGBTQI+ en France. Il permet aux membres de la communauté queer de trouver ou proposer des services du quotidien (bricolage, ménage, garde d'animaux, tech, beauté, etc.) dans un espace sécurisé et modéré."
            }
          },
          {
            "@type": "Question",
            "name": "Quels services sont disponibles sur Queer Service ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Queer Service propose des services dans 8 catégories : Bricolage & Travaux, Ménage & Aide à domicile, Garde d'animaux, Jardinage, Tech & Informatique, Transport & Déménagement, Garde d'enfants, Beauté & Bien-être."
            }
          },
          {
            "@type": "Question",
            "name": "Comment rejoindre Queer Service ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "L'inscription sur Queer Service est gratuite. Il suffit de créer un profil sur queerservices.fr, de renseigner ses compétences ou besoins, puis d'utiliser la messagerie intégrée pour échanger avec les membres."
            }
          },
          {
            "@type": "Question",
            "name": "Queer Service est-il gratuit ?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Oui, l'inscription et la consultation de l'annuaire Queer Service sont entièrement gratuites. La plateforme est pensée comme un service d'entraide communautaire sans but lucratif."
            }
          }
        ]
      }
