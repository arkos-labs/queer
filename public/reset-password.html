<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser | Queer Services</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ede9fe;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; color: #171717; }
    .subtitle { font-size: 14px; color: #666; margin-bottom: 32px; }
    .form-group { margin-bottom: 24px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #171717; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      font-size: 16px;
    }
    input:focus { outline: none; border-color: #7c3aed; }
    button {
      width: 100%;
      padding: 12px 16px;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .error { padding: 12px 16px; background: #fee; color: #c33; border-radius: 8px; margin-bottom: 24px; display: none; }
    .success { padding: 12px 16px; background: #efe; color: #3c3; border-radius: 8px; margin-bottom: 24px; display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Réinitialiser</h1>
    <p class="subtitle">Nouveau mot de passe</p>
    <div class="error" id="error"></div>
    <div class="success" id="success">Succès! Redirection...</div>
    <form id="form">
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" required minlength="8">
      </div>
      <div class="form-group">
        <label>Confirmer</label>
        <input type="password" id="confirm" required minlength="8">
      </div>
      <button type="submit" id="submit">Changer</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dummy.supabase.co';
    const SUPABASE_KEY = 'dummy-key';
    const form = document.getElementById('form');
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirm');
    const submit = document.getElementById('submit');
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.style.display = 'none';

      if (password.value !== confirm.value) {
        errorDiv.textContent = 'Mots de passe différents';
        errorDiv.style.display = 'block';
        return;
      }

      submit.disabled = true;
      submit.textContent = 'Chargement...';

      try {
        const { createClient } = window.supabase;
        const client = createClient(SUPABASE_URL, SUPABASE_KEY);
        const { error } = await client.auth.updateUser({ password: password.value });
        
        if (error) throw error;

        successDiv.style.display = 'block';
        form.style.display = 'none';
        setTimeout(() => {
          window.location.href = 'queerservices://reset-password';
        }, 2000);
      } catch (err) {
        errorDiv.textContent = err.message || 'Erreur';
        errorDiv.style.display = 'block';
        submit.disabled = false;
        submit.textContent = 'Changer';
      }
    });
  </script>
</body>
</html>
